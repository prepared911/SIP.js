# REP-99310: build SIP.js and publish it to GitHub Packages (npm registry).
# - push to the feature branch  -> build + pack dry-run only
# - push of a tag v<version>    -> build + publish (version taken from the tag)
name: Build and publish

on:
  push:
    branches:
      - "feature/REP-99310-**"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com

      - run: npm ci --ignore-scripts

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        # --ignore-scripts: the "version" script uses macOS-only sed syntax
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --ignore-scripts

      - name: Build (generate grammar, lint, compile)
        run: npm run build

      - name: Show what would be published
        run: npm pack --dry-run

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
